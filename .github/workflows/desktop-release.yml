name: Desktop Release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
      - "desktop-macos-v*"
      - "desktop-linux-v*"
      - "desktop-windows-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string
      platform:
        description: "Optional desktop platform to build."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
      checkout_ref:
        description: "Optional branch/ref to checkout while using tag for release metadata."
        required: false
        default: ""
        type: string
      publish:
        description: "Publish built artifacts to GitHub Releases."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_ref || github.ref_name) || github.ref_name }}
  SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'false' }}
  DESKTOP_PACKAGE_PATH: "packages/desktop-tauri"
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  create-release:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'false') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping creation"
          else
            prerelease_flag=""
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "Paseo $RELEASE_TAG" \
              --notes "" \
              --draft \
              $prerelease_flag || {
                echo "Release creation raced with another workflow; continuing."
                node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" > /dev/null
              }
          fi

  publish-tauri:
    needs: [create-release]
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && ((github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.os)) || (github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'desktop-v') || startsWith(github.ref_name, format('desktop-{0}-v', matrix.os))))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows
    permissions:
      contents: write
      packages: read
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set desktop package version from tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const version = process.env.DESKTOP_VERSION;
          if (!version) {
            console.log('DESKTOP_VERSION not set, skipping version update');
            process.exit(0);
          }

          // Update packages/desktop-tauri/package.json
          const pkgPath = path.join('packages', 'desktop-tauri', 'package.json');
          if (fs.existsSync(pkgPath)) {
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`Updated ${pkgPath} to ${version}`);
          }

          // Update packages/desktop-tauri/src-tauri/tauri.conf.json
          const tauriConfPath = path.join('packages', 'desktop-tauri', 'src-tauri', 'tauri.conf.json');
          if (fs.existsSync(tauriConfPath)) {
            const conf = JSON.parse(fs.readFileSync(tauriConfPath, 'utf8'));
            conf.version = version;
            fs.writeFileSync(tauriConfPath, `${JSON.stringify(conf, null, 2)}\n`);
            console.log(`Updated ${tauriConfPath} to ${version}`);
          }
          NODE

      - name: Build server dependencies & prepare dist
        shell: bash
        run: |
          set -euo pipefail
          npm run build:server:clean
          node packages/desktop-tauri/prepare-dist.mjs

      - name: Build Tauri app and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "packages/desktop-tauri"
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Paseo ${{ env.RELEASE_TAG }}"
          releaseBody: "See release notes for Paseo ${{ env.RELEASE_TAG }}."
          releaseDraft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          includeRelease: ${{ env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true' }}

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop-tauri/src-tauri/target/release/bundle/macos/*.app
            packages/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
          retention-days: 7

      - name: Ensure release artifacts uploaded
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            packages/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if (( ${#files[@]} > 0 )); then
            echo "Uploading artifacts to release $RELEASE_TAG: ${files[*]}"
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "${{ github.repository }}" || true
          fi

  finalize-release:
    needs: [create-release, publish-tauri]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'false') && (needs.publish-tauri.result == 'success' || needs.publish-tauri.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release (undraft)
        if: env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" || true)"
          if [[ -z "$release_lookup" ]]; then
            release_lookup="$RELEASE_TAG"
          fi
          echo "Publishing release $release_lookup (tag: $RELEASE_TAG)"
          publish_args=(release edit "$release_lookup" --tag "$RELEASE_TAG" --draft=false --repo "${{ github.repository }}")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            publish_args+=(--prerelease)
          fi
          gh "${publish_args[@]}"
